[aecored]
# Идентификатор пользователя ActiV-Energy.
# Установщик заменит это значение при установке экземпляра демона.
user_id = 10

# Пример задачи Scheduler.
# Тестовая программа отключена и не запускается при обычном старте.
[task:test_driver]
enabled = no
command = tests/test_driver.py
schedule = * * * * *
