# Главная конфигурация AECored ActiV-Energy.

[aecored]
# Идентификатор пользователя ActiV-Energy.
# Установщик заменит это значение при установке экземпляра демона.
user_id = 10

[paths]
# Корень установки экземпляра AECored.
root = /home/activ-energy
# Каталог конфигурационных файлов.
config = /home/activ-energy/config
# Каталог логов ядра и модулей.
logs = /home/activ-energy/logs
# Каталог драйверов.
drivers = /home/activ-energy/drivers
# Временные рабочие данные.
data = /home/activ-energy/data
# Рабочие файлы: PID, сокеты и другие runtime-данные.
run = /home/activ-energy/run

[modules]
# Включение модулей AECored.
scheduler = yes
http = yes
rabbitmq = no

[http]
# Адрес, на котором HTTP-модуль принимает подключения.
host = 0.0.0.0
# Базовый порт. Реальный порт = baseport + user_id.
baseport = 9000
# Пароль HTTP Basic Authentication.
password = pass10
# Включить HTTP Basic Authentication.
authentication = yes

[scheduler]
# Отдельная конфигурация задач Scheduler.
config = /home/activ-energy/config/scheduler.ini
# Интервал проверки конфигурации Scheduler, секунд.
check_interval = 1

[logging]
# Уровень файлового логирования.
level = INFO
# Кодировка файлов логов.
encoding = utf-8
# Формат записей логов.
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
# Максимальный размер одного файла лога, байт.
max_size = 10485760
# Количество архивных файлов лога.
backup_count = 5

[rabbitmq]
# Параметры подключения к RabbitMQ.
host = 127.0.0.1
port = 5672
virtual_host = /
username = ae
password = change-me

[rabbitmq_logging]
# Передавать логи через RabbitMQ.
enabled = no
exchange = ae.logging
routing_key = log
queue = cflogger
